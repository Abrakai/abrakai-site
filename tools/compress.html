  <h1>圖片壓縮與尺寸調整</h1>
  <p class="lead">一次放多張圖片，縮小檔案大小、限制寬高，上傳到網站或社群更順。</p>
  <div class="panel">
    <h2>設定</h2>
    <div class="row">
      <div class="field"><label for="maxW">最大寬度（像素）</label><input id="maxW" type="number" min="16" value="1600"></div>
      <div class="field"><label for="maxH">最大高度（像素，空白＝不限）</label><input id="maxH" type="number" min="16" placeholder="不限"></div>
      <div class="field"><label for="fmt">輸出格式</label><select id="fmt"><option value="auto">跟原圖一樣</option><option value="image/jpeg">JPG（照片最小）</option><option value="image/webp">WebP（網站推薦）</option><option value="image/png">PNG（保留透明）</option></select></div>
    </div>
    <div class="field"><label for="q">畫質：<span id="qv">80</span>%</label><input id="q" type="range" min="40" max="95" value="80"></div>
    <p class="privacy">只會縮小、不會放大。PNG 是無損格式，畫質設定不影響它。</p>
  </div>
  <div class="panel">
    <div id="drop" class="drop" tabindex="0" role="button" aria-label="選擇圖片">把圖片拖到這裡，或點一下選擇圖片（可以多選）<input id="file" type="file" accept="image/*" multiple></div>
    <p id="msg" class="status-msg" role="status"></p>
    <div id="list" class="grid-thumbs"></div>
    <div class="row" style="margin-top:14px"><button id="zip" class="btn btn-line" type="button" hidden>全部打包下載（ZIP）</button></div>
  </div>
  <p class="privacy">🔒 圖片只在你的瀏覽器裡處理，不會上傳到任何伺服器。</p>

<script src="/assets/vendor/jszip.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
function setupDrop(dropId, inputId, onFiles) {
  const d = $(dropId), inp = $(inputId);
  d.addEventListener("click", () => inp.click());
  d.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } });
  ["dragenter", "dragover"].forEach((t) => d.addEventListener(t, (e) => { e.preventDefault(); d.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => d.addEventListener(t, (e) => { e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", (e) => onFiles([...e.dataTransfer.files].filter((f) => f.type.startsWith("image/"))));
  inp.addEventListener("change", () => onFiles([...inp.files]));
}
const toBlob = (cv, type, q) => new Promise((res) => cv.toBlob(res, type, q));

let results = [];
$("q").oninput = () => { $("qv").textContent = $("q").value; };
async function process(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const maxW = +$("maxW").value || Infinity, maxH = +$("maxH").value || Infinity;
  const r = Math.min(1, maxW / bmp.width, maxH / bmp.height);
  const w = Math.round(bmp.width * r), h = Math.round(bmp.height * r);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  let type = $("fmt").value === "auto" ? (file.type === "image/png" ? "image/png" : file.type === "image/webp" ? "image/webp" : "image/jpeg") : $("fmt").value;
  if (type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }   // JPG 不支援透明，補白底
  ctx.imageSmoothingQuality = "high"; ctx.drawImage(bmp, 0, 0, w, h);
  const blob = await toBlob(cv, type, +$("q").value / 100);
  const ext = { "image/jpeg": "jpg", "image/webp": "webp", "image/png": "png" }[type];
  return { name: file.name.replace(/\.[^.]+$/, "") + "." + ext, blob, before: file.size, w, h, ow: bmp.width, oh: bmp.height };
}
setupDrop("drop", "file", async (files) => {
  if (!files.length) return;
  $("msg").className = "status-msg"; $("msg").textContent = `處理中…（${files.length} 張）`;
  results = []; $("list").innerHTML = "";
  for (const f of files) {
    try {
      const r = await process(f); results.push(r);
      const saved = Math.round((1 - r.blob.size / r.before) * 100);
      const fig = document.createElement("figure");
      fig.innerHTML = `<img alt="${r.name}" src="${URL.createObjectURL(r.blob)}" style="aspect-ratio:1;object-fit:cover;width:100%"><figcaption>${r.name}<br>${kb(r.before)} → <b>${kb(r.blob.size)}</b>（${saved >= 0 ? "省 " + saved + "%" : "變大 " + -saved + "%"}）<br>${r.ow}×${r.oh} → ${r.w}×${r.h}<br><a href="#" data-i="${results.length - 1}">下載</a></figcaption>`;
      $("list").appendChild(fig);
    } catch (e) { $("msg").className = "status-msg err"; $("msg").textContent = `「${f.name}」無法讀取，請確認是圖片檔。`; }
  }
  const total = results.reduce((a, r) => a + r.before, 0), after = results.reduce((a, r) => a + r.blob.size, 0);
  if (results.length) { $("msg").textContent = `完成 ${results.length} 張：${kb(total)} → ${kb(after)}`; $("zip").hidden = false; }
});
$("list").addEventListener("click", (e) => { const i = e.target.dataset.i; if (i !== undefined) { e.preventDefault(); download(results[i].blob, results[i].name); } });
$("zip").onclick = async () => { const z = new JSZip(); results.forEach((r) => z.file(r.name, r.blob)); download(await z.generateAsync({ type: "blob" }), "compressed-images.zip"); };
</script>
